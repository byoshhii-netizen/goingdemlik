version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: demlik-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER gerekli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-demlikforum}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: demlik-app
    ports:
      - "3001:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER gerekli}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@postgres:5432/${POSTGRES_DB:-demlikforum}
      VMB_PANEL_USERNAME: ${VMB_PANEL_USERNAME:?VMB_PANEL_USERNAME gerekli}
      VMB_PANEL_PASSWORD: ${VMB_PANEL_PASSWORD:?VMB_PANEL_PASSWORD gerekli}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
