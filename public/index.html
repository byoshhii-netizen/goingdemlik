  <script>
// ===== DİNAMİK TEMA RENGİ + LOGO + SİTE ADI (ANA SİTE) =====
(function() {
  function applyThemeColor(hex) {
    if (!hex || !/^#[0-9A-Fa-f]{6}$/.test(hex)) return;
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const lighter = (v,f) => Math.min(255,Math.round(v*f));
    const darker  = (v,f) => Math.max(0,Math.round(v*f));
    const toHex   = v => v.toString(16).padStart(2,'0');
    const hex2    = '#'+toHex(lighter(r,1.15))+toHex(lighter(g,1.15))+toHex(lighter(b,1.15));
    const hexDark = '#'+toHex(darker(r,0.65))+toHex(darker(g,0.65))+toHex(darker(b,0.65));
    const root = document.documentElement.style;
    const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
    root.setProperty('--admin-primary-color', hex);
    root.setProperty('--admin-primary-light', hex2);
    root.setProperty('--admin-primary-dark', hexDark);
    root.setProperty('--admin-primary-contrast', luminance > 0.62 ? '#202124' : '#ffffff');
    // Accent / brand
    root.setProperty('--accent-red',      hex);
    root.setProperty('--accent-red2',     hex2);
    root.setProperty('--accent-red-dark', hexDark);
    root.setProperty('--accent-contrast', luminance > 0.62 ? '#202124' : '#ffffff');
    root.setProperty('--grad-red',        `linear-gradient(135deg,${hex},${hexDark})`);
    root.setProperty('--bg-active',       `rgba(${r},${g},${b},0.08)`);
    // Hat / çizgi / border renkleri (tüm site)
    root.setProperty('--border',          `rgba(${r},${g},${b},0.18)`);
    root.setProperty('--border-hover',    `rgba(${r},${g},${b},0.5)`);
    root.setProperty('--border-accent',   `rgba(${r},${g},${b},0.35)`);
    root.setProperty('--accent-line',     hex);
    root.setProperty('--glow',            `0 0 20px rgba(${r},${g},${b},0.15)`);
    // Mesaj balonu renkleri
    root.setProperty('--dm-own-bg',       `rgba(${r},${g},${b},0.15)`);
    root.setProperty('--dm-own-border',   `rgba(${r},${g},${b},0.3)`);
    root.setProperty('--dm-reply-bg',     `rgba(${r},${g},${b},0.08)`);
  }
  function applyBackgroundColor(hex) {
    if (!hex || !/^#[0-9A-Fa-f]{6}$/.test(hex)) return;
    document.documentElement.style.setProperty('--admin-bg-primary', hex);
  }
  fetch('/api/settings/public')
    .then(r=>r.json())
    .then(d=>{
      if(d.primary_color) applyThemeColor(d.primary_color);
      applyBackgroundColor(d.background_color || '#121212');
      const favicon = document.querySelector('link[rel="icon"]');
      if(favicon) favicon.href = '/cigcig.png';
      // Site adı güncelle
      if(d.site_name && d.site_name.toLowerCase() !== 'demlik') {
        const navSpan = document.querySelector('.nav-brand span');
        if(navSpan) navSpan.textContent = d.site_name;
      }
    })
    .catch(()=>{});
})();
</script>

  <script>
  // --- CigCig Badge & Icon Helpers (localStorage-based - lightweight port from Cambaz) ---
  (function(){
    function setModalTitle(t){document.getElementById('modal-title').innerText = t}
    function setModalBody(html){document.getElementById('modal-body').innerHTML = html}
    function showModal(){document.getElementById('modal-overlay').classList.remove('hidden')}
    function closeModal(){document.getElementById('modal-overlay').classList.add('hidden')}
    document.getElementById('modal-close').addEventListener('click',closeModal);

    function getAllUsersLocal(){
      const users=[];
      for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k && k.startsWith('cigcig_user_')){try{const s=JSON.parse(localStorage.getItem(k)); if(s && s.nickname) users.push(s)}catch(e){} }}
      return users.sort((a,b)=>a.nickname.localeCompare(b,'tr'));
    }

    function getAllBadges(){const raw=localStorage.getItem('cigcig_badges'); return raw?JSON.parse(raw):[]}
    function saveBadges(b){localStorage.setItem('cigcig_badges',JSON.stringify(b))}

    function openBadgeManagerModal(){
      setModalTitle('Rozetleri Yönet');
      setModalBody('<div class="badge-manager-top"><input id="cig_badge_search" placeholder="Rozet ara..."></div><div id="cig_badge_list"></div>');
      const body = document.getElementById('modal-body');
      const search = document.getElementById('cig_badge_search'); search.addEventListener('input',renderBadgeManagerBody);
      renderBadgeManagerBody(); showModal();
    }

    function renderBadgeManagerBody(){
      const list=document.getElementById('cig_badge_list'); if(!list) return;
      const filter=document.getElementById('cig_badge_search').value.trim().toLowerCase();
      const badges=getAllBadges().filter(b=>b.name.toLowerCase().includes(filter)||(b.description||'').toLowerCase().includes(filter));
      list.innerHTML='';
      const top=document.createElement('div'); top.style.display='flex'; top.style.gap='8px'; top.style.marginBottom='8px';
      const newBtn=document.createElement('button'); newBtn.className='btn btn-primary'; newBtn.innerText='Yeni Rozet'; newBtn.onclick=openCreateBadgeModal; top.appendChild(newBtn);
      list.appendChild(top);
      if(!badges.length){list.innerHTML+='<div class="history-item"><span class="history-title">Rozet yok.</span></div>'; return}
      badges.forEach(b=>{
        const row=document.createElement('div'); 
        row.className='badge-row'; 
        row.innerHTML=`<div class="badge-info"><strong>${b.name}</strong><small>${b.description||''}</small></div><div style="display:flex;gap:8px"><span class="badge-chip" style="background:${b.color?b.color+'33':'rgba(255,255,255,0.06)'};border:1px solid ${b.color||'#ffffff22'}">${b.name}</span><button class="btn btn-outline" data-id="${b.id}" data-action="assign">Kullanıcıya Ver</button><button class="btn btn-outline" data-id="${b.id}" data-action="delete">Sil</button></div>`; 
        row.querySelector('[data-action="delete"]').onclick=()=>{ if(confirm('Silinsin mi?')){ deleteBadge(b.id); } }; 
        row.querySelector('[data-action="assign"]').onclick=()=>{ openAssignBadgeModal(b); }; 
        list.appendChild(row);
      });
    }

    function deleteBadge(id){ const badges=getAllBadges().filter(x=>x.id!==id); saveBadges(badges); // remove from users
      getAllUsersLocal().forEach(u=>{ if(Array.isArray(u.badges) && u.badges.includes(id)){ u.badges=u.badges.filter(x=>x!==id); localStorage.setItem('cigcig_user_'+u.nickname,JSON.stringify(u)) }}); renderBadgeManagerBody(); }

    function openCreateBadgeModal(){ setModalTitle('Yeni Rozet Oluştur'); setModalBody('<label>Rozet Adı</label><input id="cig_new_name" type="text"><label>Renk (#hex)</label><input id="cig_new_color" type="text"><label>Açıklama</label><textarea id="cig_new_desc"></textarea><div style="margin-top:8px"><button class="btn btn-outline" id="cig_new_cancel">İptal</button> <button class="btn btn-primary" id="cig_new_create">Oluştur</button></div>'); document.getElementById('cig_new_cancel').onclick=closeModal; document.getElementById('cig_new_create').onclick=createBadge; showModal(); }

    function createBadge(){ const name=document.getElementById('cig_new_name').value.trim(); const color=document.getElementById('cig_new_color').value.trim()||'#ffd633'; const desc=document.getElementById('cig_new_desc').value.trim(); if(!name){ alert('İsim girin'); return } const badges=getAllBadges(); const id='badge_'+Date.now(); badges.push({id,name,color,description:desc}); saveBadges(badges); renderBadgeManagerBody(); alert('Oluşturuldu'); }

    function openAssignBadgeModal(badge){
      setModalTitle(badge.name + ' - Kullanıcı Seç');
      const container=document.createElement('div');
      
      // Search input
      const searchDiv=document.createElement('div');
      searchDiv.style.marginBottom='12px';
      const searchInput=document.createElement('input');
      searchInput.type='text';
      searchInput.id='cig_user_search';
      searchInput.placeholder='Kullanıcı ara...';
      searchInput.style.width='100%';
      searchInput.style.padding='8px';
      searchInput.style.borderRadius='4px';
      searchInput.style.border='1px solid #444';
      searchInput.style.background='#1a1a1a';
      searchInput.style.color='#fff';
      searchDiv.appendChild(searchInput);
      container.appendChild(searchDiv);
      
      // User list
      const userListDiv=document.createElement('div');
      userListDiv.id='cig_badge_user_list';
      userListDiv.style.maxHeight='400px';
      userListDiv.style.overflowY='auto';
      container.appendChild(userListDiv);
      
      setModalBody('');
      document.getElementById('modal-body').appendChild(container);
      
      searchInput.addEventListener('input', ()=>renderAssignUserList(badge, userListDiv));
      renderAssignUserList(badge, userListDiv);
      showModal();
    }

    function renderAssignUserList(badge, container){
      const users=getAllUsersLocal();
      const filter=document.getElementById('cig_user_search')?.value.trim().toLowerCase()||'';
      const filtered=users.filter(u=>u.nickname.toLowerCase().includes(filter));
      
      container.innerHTML='';
      if(!filtered.length){ container.innerHTML='<div style="padding:8px;color:#999">Kullanıcı bulunamadı.</div>'; return; }
      
      filtered.forEach(user=>{
        const hasBadge=Array.isArray(user.badges)&&user.badges.includes(badge.id);
        const row=document.createElement('div');
        row.style.display='flex';
        row.style.justifyContent='space-between';
        row.style.alignItems='center';
        row.style.padding='8px';
        row.style.borderBottom='1px solid #333';
        row.style.cursor='pointer';
        
        const nameEl=document.createElement('div');
        nameEl.innerHTML=`<strong>${user.nickname}</strong><small style="color:#888;display:block">${hasBadge?'✓ Verildi':'Verilmedi'}</small>`;
        nameEl.style.fontSize='0.9rem';
        row.appendChild(nameEl);
        
        const btn=document.createElement('button');
        btn.className='btn '+(hasBadge?'btn-danger':'btn-primary');
        btn.innerText=hasBadge?'Geri Al':'Ver';
        btn.style.padding='4px 12px';
        btn.style.fontSize='0.85rem';
        btn.onclick=(e)=>{
          e.stopPropagation();
          if(hasBadge){
            user.badges=user.badges.filter(b=>b!==badge.id);
          } else {
            if(!Array.isArray(user.badges)) user.badges=[];
            user.badges.push(badge.id);
          }
          localStorage.setItem('cigcig_user_'+user.nickname, JSON.stringify(user));
          renderAssignUserList(badge, container);
        };
        row.appendChild(btn);
        container.appendChild(row);
      });
    }


    function getAvailableIconsForUser(user){ const icons=[]; const roles=Array.isArray(user.roles)?user.roles:(user.role? [user.role]:[]); if(roles.includes('admin')) icons.push({id:'role_admin',name:'Admin',color:'#e74c3c',char:'A'}); if(roles.includes('vip')) icons.push({id:'role_vip',name:'VIP',color:'#9b59b6',char:'V'}); if(roles.includes('plus')) icons.push({id:'role_plus',name:'Plus',color:'#f1c40f',char:'+'}); const all=getAllBadges(); if(Array.isArray(user.badges)) user.badges.forEach(bid=>{ const b=all.find(x=>x.id===bid); if(b) icons.push({id:b.id,name:b.name,color:b.color||'#777',char:(b.name&&b.name[0])||'R'}) }); return icons }

    function openConfigureIconsModal(user){ const available=getAvailableIconsForUser(user); setModalTitle(user.nickname+' - Simge Ayarları'); const container=document.createElement('div'); const instruct=document.createElement('div'); instruct.style.marginBottom='8px'; instruct.style.color='#bbb'; instruct.innerText='Gösterilecek en fazla 3 simge seçin.'; container.appendChild(instruct); const grid=document.createElement('div'); grid.style.display='flex'; grid.style.flexWrap='wrap'; grid.style.gap='8px'; const selected=Array.isArray(user.displayIcons)?user.displayIcons.slice(0):[]; available.forEach(icon=>{ const btn=document.createElement('button'); btn.className='badge-chip'; btn.style.cursor='pointer'; btn.style.border='1px solid '+(icon.color||'#ffffff22'); btn.style.background=icon.color?(icon.color+'33'):'rgba(255,255,255,0.06)'; btn.dataset.id=icon.id; btn.innerText=icon.name+' '+(icon.char||''); if(selected.includes(icon.id)) btn.style.transform='scale(0.98)'; btn.onclick=()=>{ const idx=selected.indexOf(icon.id); if(idx===-1){ if(selected.length>=3){ alert('En fazla 3'); return } selected.push(icon.id); btn.style.opacity='0.9'; btn.style.transform='scale(0.98)'; } else { selected.splice(idx,1); btn.style.opacity='1'; btn.style.transform=''; } }; grid.appendChild(btn) }); container.appendChild(grid); setModalBody(''); document.getElementById('modal-body').appendChild(container); const saveBtn=document.createElement('button'); saveBtn.className='btn btn-primary'; saveBtn.innerText='Kaydet'; saveBtn.onclick=()=>{ user.displayIcons=selected; localStorage.setItem('cigcig_user_'+user.nickname,JSON.stringify(user)); renderUserListCig(); closeModal() }; const cancel=document.createElement('button'); cancel.className='btn btn-outline'; cancel.innerText='İptal'; cancel.style.marginRight='8px'; cancel.onclick=closeModal; const actions=document.createElement('div'); actions.style.marginTop='8px'; actions.appendChild(cancel); actions.appendChild(saveBtn); document.getElementById('modal-body').appendChild(actions); showModal(); }

    function renderUserListCig(){
      const users=getAllUsersLocal(); 
      const container=document.createElement('div'); 
      if(!users.length){ container.innerHTML='<div style="padding:8px;color:#999">Hiç kullanıcı yok.</div>'; } 
      users.forEach(user=>{ 
        const row=document.createElement('div'); 
        row.style.display='flex'; 
        row.style.justifyContent='space-between'; 
        row.style.alignItems='center'; 
        row.style.padding='8px'; 
        row.style.borderBottom='1px solid #333';
        const name=document.createElement('span'); 
        name.innerText=user.nickname;
        name.style.fontWeight='500';
        row.appendChild(name); 
        container.appendChild(row); 
      }); 
      setModalTitle('Kullanıcılar'); 
      setModalBody(''); 
      document.getElementById('modal-body').appendChild(container); 
      showModal(); 
    }

    // wire dropdown button
    const dbg=document.getElementById('dropdown-badges'); if(dbg){ dbg.addEventListener('click',function(e){ e.preventDefault(); openBadgeManagerModal(); }); }

    // expose for console (optional)
    window.cigcig_openBadgeManager = openBadgeManagerModal;
    window.renderUserListCig = renderUserListCig;
  })();
  </script>
